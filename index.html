<!DOCTYPE html>
<html lang="en">
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8" />
    <meta name="description" content="<%= productDescription %>" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="initial-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>"
    />

    <!-- Google / Search Engine Tags -->
    <meta itemprop="name" content="Ramadan Time Table for South Africa" />
    <meta
      itemprop="description"
      content="Track daily Fasting, Suhoor, Iftar, and Salaah times across 340+ cities and towns in South Africa."
    />
    <meta
      itemprop="image"
      content="https://www.ramadantimes.faith/icons/Icon-512.png"
    />

    <!-- Open Graph / WhatsApp / Facebook Meta Tags -->
    <meta property="og:site_name" content="Ramadan Times" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.ramadantimes.faith" />
    <meta property="og:title" content="Ramadan Time Table for South Africa" />
    <meta
      property="og:description"
      content="Track daily Fasting, Suhoor, Iftar, and Salaah times across 340+ cities and towns in South Africa."
    />
    <meta
      property="og:image"
      content="https://www.ramadantimes.faith/icons/Icon-512.png"
    />
    <meta
      property="og:image:secure_url"
      content="https://www.ramadantimes.faith/icons/Icon-512.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Ramadan Times" />
    <meta property="fb:app_id" content="113980585602771" />

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.ramadantimes.faith" />
    <meta name="twitter:title" content="Ramadan Time Table for South Africa" />
    <meta
      name="twitter:description"
      content="Track daily Fasting, Suhoor, Iftar, and Salaah times across 340+ cities and towns in South Africa."
    />
    <meta
      name="twitter:image"
      content="https://www.ramadantimes.faith/icons/Icon-512.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="128x128"
      href="icons/favicon-128x128.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="icons/favicon-96x96.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="icons/favicon-16x16.png"
    />
    <link rel="icon" type="image/ico" href="favicon.ico" />
    <link
      rel="apple-touch-startup-image"
      href="icons/apple-launch-1170x2532.png"
    />
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
